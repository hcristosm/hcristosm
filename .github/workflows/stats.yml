name: Generate Stats SVG

on:
  schedule:
    # Roda automaticamente todos os dias à 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite rodar manualmente pela aba Actions do GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/make_stats.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "update stats.svg" && git push)