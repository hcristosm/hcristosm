<svg xmlns="http://www.w3.org/2000/svg" width="620" height="85" viewBox="0 0 620 85">
  <style>
    .label {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 11px;
      fill: #57606a;
    }
    .stat-number {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 20px;
      font-weight: bold;
      fill: #1f2328;
    }
    @media (prefers-color-scheme: dark) {
      .label { fill: #8b949e; }
      .stat-number { fill: #f0f6fc; }
    }
  </style>
  <rect width="100%" height="100%" fill="none"/>
  
  <text x="20" y="32" class="label">CONTRIBUTIONS IN THE LAST YEAR</text>
  <text x="20" y="60" class="stat-number">48</text>
</svg>
