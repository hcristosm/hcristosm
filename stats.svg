<svg xmlns="http://www.w3.org/2000/svg" width="620" height="85" viewBox="0 0 620 85">
  <style>
    .panel { fill: #f3e6cf; }
    .frame { fill: none; stroke: #c9a06a; stroke-width: 1.5; }
    .label {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      fill: #8a6b46;
    }
    .stat-number {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 20px;
      font-weight: bold;
      fill: #c9722b;
    }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #241a12; }
      .frame { stroke: #6b4423; }
      .label { fill: #c9a876; }
      .stat-number { fill: #ffb347; }
    }
  </style>
