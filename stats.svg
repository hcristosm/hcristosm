<rect x="116.92" y="4" width="95.42" height="3" fill="#f2984a"/>
<rect x="213.83" y="4" width="95.42" height="3" fill="#f5c257"/>
<rect x="310.75" y="4" width="95.42" height="3" fill="#8a9a5b"/>
<rect x="407.67" y="4" width="95.42" height="3" fill="#5b8a8a"/>
<rect x="504.58" y="4" width="95.42" height="3" fill="#7d6b96"/>
