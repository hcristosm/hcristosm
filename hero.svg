<svg xmlns="http://www.w3.org/2000/svg" width="620" height="158" viewBox="0 0 620 158">
  <defs>
    <clipPath id="clip-prompt">
      <rect x="40" y="33" width="0" height="18">
        <animate id="prompt-anim" attributeName="width" from="0" to="48" dur="0.45s" begin="0.2s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="clip-name">
      <rect x="24" y="64" width="0" height="45">
        <animate id="name-anim" attributeName="width" from="0" to="365" dur="1.0s" begin="prompt-anim.end+0.15s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .panel { fill: #f3e6cf; }
    .frame { fill: none; stroke: #c9a06a; stroke-width: 1.5; }
    .prompt-glyph {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #c9722b;
    }
    .prompt {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 13px;
      fill: #8a6b46;
    }
    .name {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 32px;
      font-weight: 700;
      fill: #4a2e18;
    }
    .role {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 12px;
      fill: #8a6b46;
    }
    .cursor { fill: #c9722b; opacity: 0; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #241a12; }
      .frame { stroke: #6b4423; }
      .prompt-glyph { fill: #ffb347; }
      .prompt { fill: #c9a876; }
      .name { fill: #f2dcb0; }
      .role { fill: #c9a876; }
      .cursor { fill: #ffb347; }
    }
  </style>
  <rect class="panel" x="0" y="0" width="620" height="158" rx="10"/>
<rect x="20.00" y="4" width="95.42" height="3" fill="#e2574c"/>
<rect x="116.92" y="4" width="95.42" height="3" fill="#f2984a"/>
<rect x="213.83" y="4" width="95.42" height="3" fill="#f5c257"/>
<rect x="310.75" y="4" width="95.42" height="3" fill="#8a9a5b"/>
<rect x="407.67" y="4" width="95.42" height="3" fill="#5b8a8a"/>
<rect x="504.58" y="4" width="95.42" height="3" fill="#7d6b96"/>
  <rect class="frame" x="0.75" y="0.75" width="618.5" height="156.5" rx="9.5"/>

  <text x="24" y="46" class="prompt-glyph">&gt;</text>
  <g clip-path="url(#clip-prompt)">
    <text x="40" y="46" textLength="48" lengthAdjust="spacingAndGlyphs" class="prompt">whoami</text>
  </g>

  <g clip-path="url(#clip-name)">
    <text x="24" y="96" textLength="365" lengthAdjust="spacingAndGlyphs" class="name">Mateus Leptokarydis</text>
  </g>

  <rect class="cursor" x="395" y="69" width="13" height="32">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" begin="name-anim.end" repeatCount="indefinite"/>
  </rect>

  <text x="24" y="122" class="role">geologist turned developer</text>
</svg>
