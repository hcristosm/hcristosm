<svg xmlns="http://www.w3.org/2000/svg" width="620" height="130" viewBox="0 0 620 130">
  <defs>
    <clipPath id="clip-name">
      <rect x="24" y="42" width="0" height="48">
        <animate id="name-anim" attributeName="width" from="0" to="388" dur="1.0s" begin="0.3s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .panel { fill: #f3e6cf; }
    .frame { fill: none; stroke: #c9a06a; stroke-width: 1.5; }
    .name {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 34px;
      font-weight: 700;
      fill: #4a2e18;
    }
    .role {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 12px;
      fill: #8a6b46;
    }
    .cursor { fill: #c9722b; opacity: 0; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #241a12; }
      .frame { stroke: #6b4423; }
      .name { fill: #f2dcb0; }
      .role { fill: #c9a876; }
      .cursor { fill: #ffb347; }
    }
  </style>
  <rect class="panel" x="0" y="0" width="620" height="130" rx="10"/>
<rect x="20.00" y="4" width="95.42" height="3" fill="#e2574c"/>
<rect x="116.92" y="4" width="95.42" height="3" fill="#f2984a"/>
<rect x="213.83" y="4" width="95.42" height="3" fill="#f5c257"/>
<rect x="310.75" y="4" width="95.42" height="3" fill="#8a9a5b"/>
<rect x="407.67" y="4" width="95.42" height="3" fill="#5b8a8a"/>
<rect x="504.58" y="4" width="95.42" height="3" fill="#7d6b96"/>
  <rect class="frame" x="0.75" y="0.75" width="618.5" height="128.5" rx="9.5"/>

  <g clip-path="url(#clip-name)">
    <text x="24" y="76" textLength="388" lengthAdjust="spacingAndGlyphs" class="name">Mateus Leptokarydis</text>
  </g>

  <rect class="cursor" x="418" y="48" width="13" height="39">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" begin="name-anim.end" repeatCount="indefinite"/>
  </rect>

  <text x="24" y="104" class="role">geologist turned developer</text>
</svg>
